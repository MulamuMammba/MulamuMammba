<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Watchman's Notebook. A private library for your poems. Each poem is a 3D book. Read it, relive the memory behind it, see its rhyme and form.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211a33"/>
      <stop offset="1" stop-color="#17131f"/>
    </linearGradient>
    <linearGradient id="e" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ece7f5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ece7f5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ece7f5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="o" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#b7a3f0" stop-opacity=".8"/>
      <stop offset="1" stop-color="#5b47a8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .l { font: 500 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 3.5px; fill: #b7a3f0; }
      .t { font: 400 38px Georgia, "Iowan Old Style", "Times New Roman", serif; fill: #ece7f5; }
      .b { font: 400 19px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ece7f5; opacity: .72; }
      .k { font: 500 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 3px; fill: #ece7f5; opacity: .5; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="228" rx="20" fill="url(#g)" stroke="#b7a3f0" stroke-opacity=".14"/>
  <rect x="40" y="1" width="1120" height="1.5" fill="url(#e)"/>
  <circle cx="1080" cy="115" r="62" fill="url(#o)"/>
  <text x="56" y="56" class="l">POETRY · ANDROID AND WEB</text>
  <text x="54" y="104" class="t">Watchman's Notebook</text>
  <text x="56" y="144" class="b">A private library for your poems. Each poem is a 3D book.</text>
  <text x="56" y="172" class="b">Read it, relive the memory behind it, see its rhyme and form.</text>
  <text x="56" y="208" class="k">ON DEVICE · 3D · RHYME ANALYSIS</text>
</svg>
