<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Kotlin and Jetpack Compose first. Signed Android builds without Gradle. Phone, tablet, DeX and Galaxy Watch. Dark first, calm motion, one clear action.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#211a33"/><stop offset="1" stop-color="#17131f"/></linearGradient>
    <linearGradient id="e" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ece7f5" stop-opacity="0"/><stop offset=".5" stop-color="#ece7f5" stop-opacity=".5"/><stop offset="1" stop-color="#ece7f5" stop-opacity="0"/></linearGradient>
    <style>
      .b{font:400 20px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#ece7f5;opacity:.78}
      .k{font:500 12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:3px;fill:#ece7f5;opacity:.5}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="248" rx="20" fill="url(#g)" stroke="#b7a3f0" stroke-opacity=".14"/>
  <rect x="40" y="1" width="1120" height="1.5" fill="url(#e)"/>
  <g fill="#b7a3f0"><circle cx="62" cy="57" r="3"/><circle cx="62" cy="99" r="3"/><circle cx="62" cy="141" r="3"/><circle cx="62" cy="183" r="3"/></g>
  <text x="82" y="64" class="b">Kotlin and Jetpack Compose first. A web version when iPhone users need it.</text>
  <text x="82" y="106" class="b">Signed Android builds without Gradle, using aapt2, javac and dx.</text>
  <text x="82" y="148" class="b">Phone, tablet, DeX and Galaxy Watch.</text>
  <text x="82" y="190" class="b">One design standard: dark first, calm motion, one clear action.</text>
  <text x="56" y="228" class="k">KOTLIN · JAVA · COMPOSE · SPRING · DOCKER · GIT</text>
</svg>
