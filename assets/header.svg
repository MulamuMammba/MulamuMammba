<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Mulamuleli Mammba. Quiet apps, built to last.">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17131f"/>
      <stop offset="1" stop-color="#0d0b14"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#b7a3f0" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#5b47a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#17131f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b47a8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5b47a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ece7f5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ece7f5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ece7f5" stop-opacity="0"/>
    </linearGradient>
    <style>
      .breathe { animation: breathe 6s ease-in-out infinite; transform-origin: 960px 180px; }
      @keyframes breathe { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
      .label { font: 500 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 4px; fill: #b7a3f0; }
      .name { font: 400 58px Georgia, "Iowan Old Style", "Times New Roman", serif; fill: #ece7f5; }
      .line { font: 400 21px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ece7f5; opacity: .72; }
    </style>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#ground)"/>
  <rect x="40" y="0.5" width="1120" height="1.5" fill="url(#edge)"/>
  <g class="breathe">
    <circle cx="960" cy="180" r="170" fill="url(#halo)"/>
  </g>
  <circle cx="960" cy="180" r="92" fill="url(#orb)"/>
  <!-- the vine -->
  <g fill="none" stroke="#b7a3f0" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round">
    <path d="M820 330 C 860 290, 880 300, 910 270 S 980 250, 1010 215"/>
    <path d="M868 296 c -10 -14 -6 -26 6 -32 c 4 12 2 24 -6 32z" fill="#b7a3f0" fill-opacity=".18"/>
    <path d="M938 262 c 2 -16 12 -24 26 -22 c -4 12 -12 20 -26 22z" fill="#b7a3f0" fill-opacity=".18"/>
  </g>
  <text x="80" y="122" class="label">THE WATCHMAN HOUSE OF APPS</text>
  <text x="78" y="196" class="name">Mulamuleli Mammba</text>
  <rect x="80" y="222" width="56" height="2" rx="1" fill="#d8b25e"/>
  <text x="80" y="268" class="line">I build quiet apps for phones and watches.</text>
  <text x="80" y="300" class="line">Slow by design. Made to last.</text>
</svg>
